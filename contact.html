<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Me</title>

<style>

body{
font-family:Arial,sans-serif;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
width:450px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:30px;
color:#0f172a;
}

input,textarea{
width:100%;
padding:15px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;
}

textarea{
height:180px;
resize:vertical;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

<div class="container">

<h1>Contact Me</h1>

<form
action="https://formsubmit.co/abhimanyoo.biswas@gmail.com"
method="POST">

<input type="text"
name="Name"
placeholder="Your Name"
required>

<input type="email"
name="Email"
placeholder="Your Email"
required>

<input type="text"
name="Subject"
placeholder="Subject"
required>

<textarea
name="Message"
placeholder="Write your message..."
required></textarea>

<input type="hidden"
name="_captcha"
value="false">

<input type="hidden"
name="_subject"
value="New message from GitHub Portfolio">

<input type="hidden"
name="_next"
value="https://abhimanyoobiswas.github.io/thankyou.html">

<button type="submit">
Send Message
</button>

</form>

</div>

</body>
</html>
